<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAQ SP Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'JetBrains Mono', monospace; background: #fff; color: #111; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="lastVisit" style="position:fixed;bottom:10px;right:10px;
background:#f3f4f6;padding:8px 12px;border-radius:8px;font-size:12px;">
</div>

<script>
const lastVisit = localStorage.getItem("lastVisit");

if (lastVisit) {
  document.getElementById("lastVisit").innerText =
    "👋 Last visited: " + lastVisit;
}

localStorage.setItem(
  "lastVisit",
  new Date().toLocaleString()
);
</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
